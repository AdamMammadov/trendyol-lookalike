 <!DOCTYPE html>
<html lang="az">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Səbət</title>
  <style>
  

    body {
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      margin: 0;
      padding: 20px;
    }

    h1 {
      text-align: center;
    }

    .cart-items {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 15px;
      margin-top: 20px;
    }

    .item {
      background: #fff;
      padding: 15px;
      border-radius: 8px;
      text-align: center;
      box-shadow: 0 0 5px rgba(0,0,0,0.1);
    }

    .item img {
      max-width: 100%;
      border-radius: 5px;
    }

    .item button {
      margin-top: 10px;
      padding: 5px 10px;
      border: none;
      background: #e74c3c;
      color: white;
      border-radius: 5px;
      cursor: pointer;
    }

    .item button:hover {
      background: #c0392b;
    }

    .total {
      margin-top: 20px;
      text-align: center;
      font-size: 18px;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <h1>Səbətim</h1>
  <div id="cartItems" class="cart-items"></div>
  <div id="totalPrice" class="total"></div>

  <script>
    function loadCart() {
      const cart = JSON.parse(localStorage.getItem("cart")) || [];
      const container = document.getElementById("cartItems");
      const totalDiv = document.getElementById("totalPrice");
      container.innerHTML = "";

      if (cart.length === 0) {
        container.innerHTML = "<p>Səbət boşdur ❗</p>";
        totalDiv.innerHTML = "";
        return;
      }

      let total = 0;

      cart.forEach((product, index) => {
        total += product.price;

        const div = document.createElement("div");
        div.classList.add("item");
        div.innerHTML = `
          <img src="${product.image}" alt="${product.name}">
          <h3>${product.name}</h3>
          <p><b>Qiymət:</b> ${product.price} AZN</p>
          <button onclick="removeFromCart(${index})">Sil</button>
        `;
        container.appendChild(div);
      });

      totalDiv.innerHTML = "Ümumi məbləğ: " + total + " AZN";
    }

    function removeFromCart(index) {
      let cart = JSON.parse(localStorage.getItem("cart")) || [];
      cart.splice(index, 1);
      localStorage.setItem("cart", JSON.stringify(cart));
      loadCart();
    }

    loadCart();
  </script>
</body>
</html>
